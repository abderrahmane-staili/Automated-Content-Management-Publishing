services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Casablanca}
      - TZ=${GENERIC_TIMEZONE:-Africa/Casablanca}
      - N8N_SECURE_COOKIE=false
    extra_hosts:
      # lets n8n (inside Docker) reach the bots running on your host
      - "host.docker.internal:host-gateway"
    volumes:
      - ./n8n_data:/home/node/.n8n
