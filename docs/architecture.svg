<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">n8n + Playwright — WordPress → Facebook Groups pipeline</text>

  <!-- top row -->
  <rect x="40" y="70" width="190" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="135" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">① Source sites</text>
  <text x="135" y="126" text-anchor="middle" font-size="12" fill="#0c4a6e">sub.domain.com (×10)</text>

  <rect x="300" y="70" width="220" height="80" rx="12" fill="#ffe4e0" stroke="#ff6d5a" stroke-width="2"/>
  <text x="410" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">② n8n — Main workflow</text>
  <text x="410" y="126" text-anchor="middle" font-size="12" fill="#7f1d1d">Schedule · Scrape · Filter · Dispatch</text>

  <rect x="600" y="70" width="200" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">③ WordPress</text>
  <text x="700" y="126" text-anchor="middle" font-size="12" fill="#14532d">REST API: media + posts</text>

  <rect x="880" y="70" width="240" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1000" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Telegram alerts</text>
  <text x="1000" y="126" text-anchor="middle" font-size="12" fill="#312e81">success / error per sub-workflow</text>

  <rect x="40" y="200" width="200" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="140" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Google Sheets</text>
  <text x="140" y="252" text-anchor="middle" font-size="12" fill="#713f12">posts + groups queue</text>

  <!-- top arrows -->
  <line x1="230" y1="110" x2="298" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="264" y="102" text-anchor="middle" font-size="11" fill="#475569">title · desc · img</text>
  <line x1="520" y1="110" x2="598" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="559" y="102" text-anchor="middle" font-size="11" fill="#475569">publish</text>
  <line x1="330" y1="150" x2="200" y2="198" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M410,70 V48 H1000 V68" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>

  <!-- dispatch bus -->
  <text x="470" y="215" font-size="12" fill="#475569">④ dispatch groups to 4 sub-workflows</text>
  <line x1="450" y1="150" x2="450" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="220" y1="300" x2="820" y2="300" stroke="#475569" stroke-width="2"/>

  <!-- subs -->
  <g font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">
    <rect x="140" y="335" width="160" height="60" rx="10" fill="#ffe4e0" stroke="#ff6d5a" stroke-width="2"/><text x="220" y="370">Sub 1</text>
    <rect x="340" y="335" width="160" height="60" rx="10" fill="#ffe4e0" stroke="#ff6d5a" stroke-width="2"/><text x="420" y="370">Sub 2</text>
    <rect x="540" y="335" width="160" height="60" rx="10" fill="#ffe4e0" stroke="#ff6d5a" stroke-width="2"/><text x="620" y="370">Sub 3</text>
    <rect x="740" y="335" width="160" height="60" rx="10" fill="#ffe4e0" stroke="#ff6d5a" stroke-width="2"/><text x="820" y="370">Sub 4</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="220" y1="300" x2="220" y2="333"/><line x1="420" y1="300" x2="420" y2="333"/>
    <line x1="620" y1="300" x2="620" y2="333"/><line x1="820" y1="300" x2="820" y2="333"/>
  </g>

  <!-- bots -->
  <text x="40" y="455" font-size="12" fill="#475569">⑤ HTTP POST /post-to-group</text>
  <g text-anchor="middle" fill="#1e293b">
    <rect x="140" y="470" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="220" y="498" font-size="14" font-weight="700">Bot :3001</text><text x="220" y="518" font-size="12">Playwright + Brave</text><text x="220" y="536" font-size="11">profile #1</text>
    <rect x="340" y="470" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="420" y="498" font-size="14" font-weight="700">Bot :3002</text><text x="420" y="518" font-size="12">Playwright + Brave</text><text x="420" y="536" font-size="11">profile #2</text>
    <rect x="540" y="470" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="620" y="498" font-size="14" font-weight="700">Bot :3003</text><text x="620" y="518" font-size="12">Playwright + Brave</text><text x="620" y="536" font-size="11">profile #3</text>
    <rect x="740" y="470" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="820" y="498" font-size="14" font-weight="700">Bot :3004</text><text x="820" y="518" font-size="12">Playwright + Brave</text><text x="820" y="536" font-size="11">profile #4</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="220" y1="395" x2="220" y2="468"/><line x1="420" y1="395" x2="420" y2="468"/>
    <line x1="620" y1="395" x2="620" y2="468"/><line x1="820" y1="395" x2="820" y2="468"/>
  </g>

  <!-- facebook -->
  <rect x="140" y="610" width="760" height="60" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="520" y="636" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">⑥ Facebook groups (10+)</text>
  <text x="520" y="656" text-anchor="middle" font-size="12" fill="#1e3a8a">post title + image · comment the WordPress link</text>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="220" y1="550" x2="220" y2="608"/><line x1="420" y1="550" x2="420" y2="608"/>
    <line x1="620" y1="550" x2="620" y2="608"/><line x1="820" y1="550" x2="820" y2="608"/>
  </g>
</svg>
